name: Monatliches Scraping

# Läuft am 1. jedes Monats um 04:00 UTC – und lässt sich manuell auslösen.
on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

# Nötig, damit der Job die neuen CSV zurück ins Repository committen darf.
permissions:
  contents: write

# Verhindert parallele Läufe (z. B. Zeitplan + manuell gleichzeitig).
concurrency:
  group: scraping
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Scraper ausführen
        run: python main.py

      - name: Ergebnisse committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Keine Änderungen – nichts zu committen."
          else
            git commit -m "Daten: Förderkatalog-Export $(date -u +%Y-%m-%d)"
            git push
          fi
